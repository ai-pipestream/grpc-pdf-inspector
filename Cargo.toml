[package]
name = "grpc-pdf-inspector"
version = "0.2.0"
description = "A gRPC server that classifies PDFs in memory and streams per-page markdown back"
license = "Apache-2.0"
readme = "README.md"
keywords = ["pdf", "grpc", "streaming", "classification", "markdown"]
categories = ["parsing", "network-programming"]
edition = "2024"
# tonic 0.14 and tonic-prost 0.14 both declare 1.88; nothing else here is
# newer, so the transport sets the floor.
rust-version = "1.88"
publish = false # Server binary; not a library for crates.io.

[dependencies]
# firecrawl's MIT-licensed PDF classifier/extractor, vendored under
# `vendor/pdf-inspector` and patched there. Default features only: pure Rust
# (lopdf + rayon), no models, no ONNX. The firecrawl monorepo itself is AGPL
# and is never touched; this is the published 1.17.0 crate only.
#
# It is vendored rather than depended on from crates.io because four things
# this service must capture are computed inside it and not returned by any
# public API. `vendor/pdf-inspector/README.md` names them and
# `docs/capture-deferrals.md` records the patch for each.
pdf-inspector = { path = "vendor/pdf-inspector" }
# The document's own dictionaries: the information dictionary, the XMP
# packet, the outline, embedded files, per-page boxes and the link
# annotations' destinations. pdf-inspector reads none of them and does not
# re-export the lopdf it parses with, so reading them means parsing the
# buffer again here. That is what `emit_metadata` costs, and why it is
# opt-in.
lopdf = "0.45"
prost = "0.14.4"
# `google.protobuf.Value`, which the vendored document schema uses for the
# `BaseMeta.custom_fields` escape hatch the Document fold writes into.
prost-types = "0.14.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = { version = "0.14.6", features = ["gzip", "zstd"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"

[dev-dependencies]
# Tests author every PDF fixture in memory with the same library the
# metadata pass reads with; nothing binary is committed.
tokio-stream = { version = "0.1.19", features = ["net"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
