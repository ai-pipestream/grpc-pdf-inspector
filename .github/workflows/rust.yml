name: Rust

on: [ push, pull_request ]

jobs:
  rust:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain:
          - "1.88"  # MSRV, set by tonic 0.14.
          - stable
          - beta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Toolchain version
        run: |
          cargo -vV
          rustc -vV
      - name: Build
        run: cargo build
      - name: Run tests
        run: cargo test
      # The vendored parser crate is a separate package with its own lock,
      # so the step above never runs its unit tests.
      - name: Run the vendored crate's tests
        run: cargo test --locked --manifest-path vendor/pdf-inspector/Cargo.toml
      - name: Install rustfmt, clippy
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: ${{ matrix.toolchain == 'stable' }}
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format checks
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo fmt -- --check
      - name: Clippy checks
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo clippy --all-targets --all-features -- -Dwarnings

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - name: Lint the protobuf contract
        run: |
          buf lint
          buf build

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The image build runs the test suite itself, so this is both the
      # packaging check and a second, containerised run of the gate.
      - name: Build the container image
        run: docker build -t grpc-pdf-inspector:ci .
