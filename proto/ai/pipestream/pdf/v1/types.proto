// SPDX-License-Identifier: Apache-2.0
//
// Shared types for the PDF inspector: the per-call options, the three event
// payloads that make up the response stream, and the server's advertised
// limits.
//
// A PDF is either cheap to read or expensive to read, and the difference is
// whether its pages carry a real text layer. This service exists to answer
// that question in tens of milliseconds (`info`), and to stream the text
// layer out page by page when there is one (`page` events). Pages without a
// usable text layer are *reported* (`pages_needing_ocr`) so a caller can
// route only those to a heavy OCR path; this server never OCRs.

syntax = "proto3";

package ai.pipestream.pdf.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "PdfTypesProto";

// ProcessMode selects how far the pipeline runs for one call.
//
// Detection is always performed and always reported in `info`; the mode only
// governs what happens after it.
enum ProcessMode {
  // The server default: FULL.
  PROCESS_MODE_UNSPECIFIED = 0;

  // Classify only. The stream is `info`, then `status`; no page is
  // extracted. This is the ~10-50ms routing answer.
  PROCESS_MODE_DETECT_ONLY = 1;

  // Classify and analyze the text layer (layout complexity, encoding
  // issues) without producing markdown. The stream is `info`, then
  // `status` carrying the analysis; no `page` events.
  PROCESS_MODE_ANALYZE = 2;

  // Classify and extract markdown per page. The stream is `info`, then one
  // `page` event per extracted page, then `status`.
  PROCESS_MODE_FULL = 3;
}

// PdfOptions configures a single ParsePdf call.
message PdfOptions {
  // How far the pipeline runs. Absent means FULL.
  ProcessMode mode = 1;

  // 1-indexed pages to process, empty meaning all pages. Page 0 is
  // rejected with INVALID_ARGUMENT. Detection always covers the whole
  // document; this selects which pages are analyzed or extracted.
  //
  // Note the indexing: PDF page numbers on this wire are 1-indexed, as
  // they are in every viewer. (The underlying library's per-page
  // extraction API is 0-indexed; the server converts.)
  repeated uint32 pages = 2;

  // Password for an encrypted PDF. Empty means none; an encrypted PDF
  // without a working password fails with INVALID_ARGUMENT.
  //
  // With a password set, FULL mode falls back to whole-document extraction
  // (the library's per-page API takes no password): the markdown arrives
  // as a single `page` event with `page_no` 0 and the trailer carries a
  // PARSE_WARNING_CODE_PASSWORD_FALLBACK warning.
  string password = 3;

  // Also fold this parse into one `ai.pipestream.document.v1.Document` and
  // send it as a `document` event after the last `page` event and before
  // `status`. Default false, which costs nothing: no fold is built and no
  // markdown is retained.
  //
  // The event stream stays the primary, lossless wire; the Document is a
  // structural projection of it, built so a coordinator can merge it
  // additively with another collector's parse of the same document.
  //
  // The fold behind it consumes every event this parse produces, including
  // the ones the flags below keep off the wire: setting `emit_document`
  // alone still yields a Document with provenance boxes on its items,
  // because the spans that carry them were folded on their way past.
  bool emit_document = 4;

  // Also stream the positioned text runs each page's markdown was rendered
  // from, as one `spans` event per page immediately before that page's
  // `page` event. Default false.
  //
  // The runs are what the extractor actually saw: text, box, font, size,
  // the bold/italic/underline/strikeout flags, the marked-content id, and
  // the link target for a link annotation. Markdown is a rendering of
  // them, so this is the lossless half of a FULL stream and the only place
  // a coordinate appears on this wire.
  bool emit_spans = 5;

  // Also read the document's own dictionaries and stream them as one
  // `metadata` event, immediately after `info`. Default false.
  //
  // This is everything the file says about itself rather than about its
  // text: the information dictionary, the XMP packet, the file-format
  // version, the catalog language, the tagged flag, the encryption
  // posture, the outline, embedded file attachments, per-page boxes and
  // rotation, page labels, named destinations, and the link annotations
  // with their targets resolved. It costs one read of the file, which is
  // why it is opt-in.
  bool emit_metadata = 6;
}

// Rect is an axis-aligned rectangle in PDF user space.
//
// The unit is the PDF point (1/72 inch) and the origin is the page's
// bottom-left corner, with y increasing upwards — the space the file
// itself is written in, unrotated and unscaled. A consumer that wants
// top-left coordinates subtracts from the page box, which arrives on
// `PageGeometry`.
message Rect {
  // Distance from the page's left edge to the rectangle's left edge.
  double x = 1;

  // Distance from the page's bottom edge to the rectangle's bottom edge.
  // For a text run this is the baseline, not the descender.
  double y = 2;

  // Extent along x. Never negative.
  double width = 3;

  // Extent along y. Never negative.
  double height = 4;
}

// SpanKind names what a positioned run actually is.
//
// The extractor emits more than glyphs: an image XObject contributes its
// placement box, a link annotation contributes its rectangle and target,
// and an AcroForm field contributes its value.
enum SpanKind {
  // Never sent. Present because proto3 requires a zero value.
  SPAN_KIND_UNSPECIFIED = 0;

  // Glyphs drawn by a text-showing operator.
  SPAN_KIND_TEXT = 1;

  // An image XObject's placement box. `text` is a placeholder, not
  // content.
  SPAN_KIND_IMAGE = 2;

  // A link annotation's rectangle. `link_uri` carries its target.
  SPAN_KIND_LINK = 3;

  // An AcroForm field's value.
  SPAN_KIND_FORM_FIELD = 4;
}

// TextSpan is one positioned run as the extractor saw it, before markdown.
message TextSpan {
  // The run's text. For an image span this is a placeholder.
  string text = 1;

  // Where the run sits on its page.
  Rect bbox = 2;

  // The `/BaseFont` family name, subset prefix included
  // ("ABCDEF+CMMI10"). Empty for runs that no show operator produced.
  string font_family = 3;

  // The page-resource tag the show operator selected ("F2"). Its namespace
  // is the enclosing page's resources, so the same tag on another page may
  // name a different face; within one page it separates font programs that
  // share a family name.
  string font_tag = 4;

  // Type size in points, 0 for runs that no show operator produced.
  float font_size = 5;

  // Whether the face is bold.
  bool bold = 6;

  // Whether the face is italic.
  bool italic = 7;

  // Whether a rule is drawn under the baseline. PDF has no underline flag,
  // so this is geometric.
  bool underline = 8;

  // Whether a rule crosses the glyphs at mid x-height. Geometric, as
  // above.
  bool strikeout = 9;

  // The marked-content id from the page's content stream, when the run
  // sits inside a BDC/BMC pair. This is the join key to the tagged
  // structure tree.
  optional int64 mcid = 10;

  // What kind of run this is.
  SpanKind kind = 11;

  // For SPAN_KIND_LINK, the annotation's target. Empty otherwise.
  string link_uri = 12;
}

// PageSpans carries one page's positioned runs, in extraction order.
//
// Sent immediately before that page's `page` event, so a consumer that
// wants both sees the runs first and the rendering they produced second.
message PageSpans {
  // The 1-indexed page these runs came from.
  uint32 page_no = 1;

  // The runs, in the order the extractor produced them.
  repeated TextSpan spans = 2;
}

// PdfType is the routing answer: how the pages' content is stored.
enum PdfType {
  // Never sent by the server; the detection always reaches a conclusion or
  // the call fails.
  PDF_TYPE_UNSPECIFIED = 0;

  // Pages carry a real text layer (text operators). Markdown extraction is
  // cheap and reliable.
  PDF_TYPE_TEXT_BASED = 1;

  // Pages are raster scans with no text layer. Every page needs OCR.
  PDF_TYPE_SCANNED = 2;

  // Pages are mostly images with minimal or no text. Extraction is
  // skipped; most pages need OCR.
  PDF_TYPE_IMAGE_BASED = 3;

  // Some pages have text, some are image-heavy. Text pages extract
  // normally; `pages_needing_ocr` names the rest.
  PDF_TYPE_MIXED = 4;
}

// OcrReason names why a page's text layer is unusable, when known.
enum OcrReason {
  // Never sent. Present because proto3 requires a zero value.
  OCR_REASON_UNSPECIFIED = 0;

  // The page has no extractable text and no image to OCR: blank, or
  // content the parser cannot reach.
  OCR_REASON_NO_TEXT = 1;

  // The page is a scanned image (a full-page raster) with no usable text
  // layer.
  OCR_REASON_SCANNED = 2;

  // The page has a text layer, but it decodes to mojibake (broken font
  // encodings), so extraction cannot be trusted.
  OCR_REASON_SUSPECTED_GARBLED = 3;

  // The page's text is drawn as vector outlines (path operators) rather
  // than real text operators, so there are no characters to extract.
  OCR_REASON_VECTOR_TEXT = 4;
}

// PageOcrReasons lists the OCR reasons for one page.
message PageOcrReasons {
  // The 1-indexed page the reasons concern.
  uint32 page = 1;

  // Machine-readable reasons, in detection order.
  repeated OcrReason reasons = 2;
}

// LayoutComplexity reports whether the text layer's layout is simple
// enough for plain markdown to represent faithfully.
//
// It is computed from extracted text positions, which is why it arrives on
// the `status` trailer rather than on `info`: detection alone does not
// look at positions.
message LayoutComplexity {
  // True when any page has tables or multi-column text.
  bool is_complex = 1;

  // 1-indexed pages where table borders were detected.
  repeated uint32 pages_with_tables = 2;

  // 1-indexed pages where multi-column text was detected.
  repeated uint32 pages_with_columns = 3;
}

// PdfInfo is the opening event of every successful stream.
//
// It is sent as soon as classification completes — tens of milliseconds
// for a typical document, before a single page has been extracted — so a
// caller can make its routing decision (fast local markdown versus the
// OCR path) without waiting for the body of the stream.
message PdfInfo {
  // How the document's content is stored; the routing answer.
  PdfType pdf_type = 1;

  // Detection confidence, 0.0 to 1.0.
  float confidence = 2;

  // Total pages in the document.
  uint32 page_count = 3;

  // Title from the PDF metadata, empty when the document declares none.
  string title = 4;

  // 1-indexed pages whose text layer is unusable and which therefore need
  // OCR. Empty for a fully text-based document. In FULL mode these pages
  // still get a `page` event, with empty markdown.
  repeated uint32 pages_needing_ocr = 5;

  // Why each of those pages needs OCR, when the cause is known.
  repeated PageOcrReasons ocr_reasons = 6;

  // Milliseconds the classification itself took, so a caller can check
  // that the cheap answer stayed cheap.
  uint64 detection_time_ms = 7;
}

// PageMarkdown is one extracted page, in requested page order.
//
// Emitted only in FULL mode, and only for text-based and mixed documents;
// scanned and image-based documents have nothing to extract and produce
// none. With the password fallback (see PdfOptions.password) the whole
// document's markdown arrives as one event with `page_no` 0.
message PageMarkdown {
  // The 1-indexed page this markdown came from, or 0 for the
  // whole-document fallback.
  uint32 page_no = 1;

  // The page's text layer as markdown. Empty when the page needs OCR.
  string markdown = 2;

  // True when this page's own text layer is unreliable, as judged by the
  // pass that read it rather than by the sampling detection on `info`.
  //
  // The two can disagree, and the disagreement is the point: detection
  // samples pages and answers about the document, while this answers about
  // this page after its glyphs were actually decoded. A page that decoded
  // to mojibake shows up here even when the document as a whole looked
  // fine.
  bool needs_ocr = 3;

  // Why, when the cause is known. UNSPECIFIED when `needs_ocr` is false.
  OcrReason ocr_reason = 4;
}

// DocumentInfo is the document's information dictionary, field by field.
//
// Every value here is what the file says about itself. None of it is
// verified: a producer writes its own name, and a date is whatever string
// the writing application put there.
message DocumentInfo {
  // The document's title, empty when it declares none.
  string title = 1;

  // Authors, split on the usual separators when the single `/Author`
  // string lists several. A file that names one author yields one entry.
  repeated string authors = 2;

  // The subject line.
  string subject = 3;

  // Keywords, split from the single `/Keywords` string.
  repeated string keywords = 4;

  // The application that authored the original document.
  string creator_tool = 5;

  // The application that converted it to PDF.
  string producer = 6;

  // When the document was created, as the file states it. Absent when the
  // file states nothing or states something unparseable — `created_raw`
  // still carries the string in that case.
  google.protobuf.Timestamp created = 7;

  // When the document was last modified, on the same terms.
  google.protobuf.Timestamp modified = 8;

  // The creation date exactly as written, PDF `D:` form included.
  string created_raw = 9;

  // The modification date exactly as written.
  string modified_raw = 10;

  // The `/Trapped` value: "True", "False" or "Unknown".
  string trapped = 11;
}

// EncryptionInfo describes how the document is protected, whether or not
// the protection stopped this parse.
//
// A PDF can be readable with the empty password and still declare that
// extraction is not permitted. That is a fact about the file that a
// pipeline overriding it should at least be able to see.
message EncryptionInfo {
  // Whether the file carries an `/Encrypt` dictionary at all.
  bool encrypted = 1;

  // The security handler's name, normally "Standard".
  string filter = 2;

  // Algorithm version (`/V`).
  uint32 version = 3;

  // Handler revision (`/R`).
  uint32 revision = 4;

  // Key length in bits (`/Length`), 40 when the file omits it.
  uint32 key_bits = 5;

  // Whether the document opened without a password being supplied.
  bool opened_with_empty_password = 6;

  // Whether the permission bits allow text extraction.
  bool allows_extraction = 7;

  // Whether they allow printing.
  bool allows_printing = 8;
}

// OutlineEntry is one bookmark of the document's own outline tree,
// flattened into a list that keeps its depth.
message OutlineEntry {
  // The bookmark's label.
  string title = 1;

  // Depth, 1 for a top-level bookmark.
  uint32 level = 2;

  // The 1-indexed page it points at, 0 when the destination does not
  // resolve to a page of this document.
  uint32 page_no = 3;

  // For a bookmark whose action is a URI rather than a destination, that
  // URI. Empty otherwise.
  string uri = 4;

  // The named destination it points at, verbatim, when it points at one by
  // name.
  string dest_name = 5;
}

// EmbeddedFile is one file attachment the document carries.
//
// A PDF is a container: it can carry the spreadsheet a table was made
// from, or a signed original. Without this the payload is invisible to the
// whole pipeline.
message EmbeddedFile {
  // The attachment's file name, from `/UF` when present and `/F`
  // otherwise.
  string name = 1;

  // The declared media type, empty when the file declares none.
  string media_type = 2;

  // Size in bytes, as the file declares it. 0 when it declares none.
  uint64 size_bytes = 3;

  // The attachment's description.
  string description = 4;
}

// PageGeometry is one page's boxes, rotation and printed number.
//
// Without it no coordinate on this wire is interpretable: a box means
// nothing until a reader knows where the page's edges are and how far the
// page is turned.
message PageGeometry {
  // The 1-indexed page.
  uint32 page_no = 1;

  // The page's full extent, inherited down the page tree when the page
  // itself declares none.
  Rect media_box = 2;

  // The visible extent. Equal to `media_box` when the page declares no
  // crop box.
  Rect crop_box = 3;

  // Clockwise rotation applied when displaying, in degrees: 0, 90, 180 or
  // 270.
  uint32 rotation = 4;

  // The scale factor for the page's user space, 1.0 unless the page says
  // otherwise.
  double user_unit = 5;

  // The page's own printed number ("iv", "A-1"), when the document
  // declares page labels. Empty otherwise, which means the page's index is
  // its number.
  string label = 6;
}

// LinkTarget is one `/Link` annotation with its destination resolved.
//
// External targets are a URI. Internal ones — a table of contents, a
// cross-reference, a footnote jump — name a page, either directly or
// through a named destination.
message LinkTarget {
  // The 1-indexed page the annotation is drawn on.
  uint32 page_no = 1;

  // Where on that page it is drawn.
  Rect rect = 2;

  // The external target, empty for an internal link.
  string uri = 3;

  // The 1-indexed page an internal link leads to, 0 when the destination
  // does not resolve.
  uint32 dest_page_no = 4;

  // The named destination it goes through, verbatim. Empty when the link
  // names a page directly.
  string dest_name = 5;
}

// NamedDestination is one entry of the document's destination name tree:
// a name other parts of the file use to point at a place in it.
message NamedDestination {
  // The destination's name.
  string name = 1;

  // The 1-indexed page it names, 0 when it does not resolve.
  uint32 page_no = 2;
}

// PdfMetadata is everything the file says about itself.
//
// Sent once, immediately after `info`, and only when
// `PdfOptions.emit_metadata` was set. It is read from the document's own
// dictionaries rather than from its text, so it is the same in every
// mode.
message PdfMetadata {
  // The information dictionary.
  DocumentInfo info = 1;

  // The XMP packet from `/Root /Metadata`, verbatim and undecoded, so no
  // dialect is imposed on it here. Empty when the document carries none.
  bytes xmp_packet = 2;

  // The file-format version from the header, for example "1.7".
  string pdf_version = 3;

  // The document's language from `/Root /Lang`, a BCP 47 tag. Empty when
  // it declares none.
  string language = 4;

  // Whether the document declares itself tagged (`/Root /MarkInfo
  // /Marked`), which is what makes its structure tree trustworthy.
  bool tagged = 5;

  // The first half of the file identifier from the trailer's `/ID`, lower
  // case hex. This identifies the document from inside the file, which is
  // the only identity a byte stream carries.
  string file_id = 6;

  // How the document is protected.
  EncryptionInfo encryption = 7;

  // The document's own outline, depth-first.
  repeated OutlineEntry outline = 8;

  // File attachments the document carries.
  repeated EmbeddedFile embedded_files = 9;

  // Per-page boxes, rotation and printed numbers, in page order. Covers
  // every page of the document, not only the ones a page filter selected.
  repeated PageGeometry pages = 10;

  // Every `/Link` annotation, with its destination resolved.
  repeated LinkTarget links = 11;

  // The document's named destinations.
  repeated NamedDestination destinations = 12;
}

// ParseWarningCode names a condition that did not stop the parse.
enum ParseWarningCode {
  // Never sent. Present because proto3 requires a zero value.
  PARSE_WARNING_CODE_UNSPECIFIED = 0;

  // A password was supplied, so FULL mode used whole-document extraction:
  // the markdown arrived as one `page` event with `page_no` 0 instead of
  // one event per page.
  PARSE_WARNING_CODE_PASSWORD_FALLBACK = 1;

  // `emit_metadata` was set but the document's dictionaries could not be
  // read, so no `metadata` event was sent. The text extraction is
  // unaffected: this reports a gap, not a failure.
  PARSE_WARNING_CODE_METADATA_UNAVAILABLE = 2;
}

// ParseWarning is one non-fatal observation, carried on ParseStatus.
message ParseWarning {
  // What happened.
  ParseWarningCode code = 1;

  // Human-readable detail, for logs. Not a stable contract; switch on
  // `code`.
  string message = 2;
}

// ParseStatus is the trailer that closes every successful stream.
//
// It is a receipt, not the payload: everything worth having has already
// been delivered by the time it arrives. The layout analysis lives here
// rather than on `info` because it is computed from extracted text
// positions, after `info` has already gone out.
message ParseStatus {
  // How many `page` events were emitted. Equals the number of requested
  // pages on a complete FULL stream; zero in DETECT_ONLY and ANALYZE.
  uint32 pages_extracted = 1;

  // Non-fatal observations, in the order they occurred.
  repeated ParseWarning warnings = 2;

  // Layout complexity of the text layer. Populated in ANALYZE and FULL for
  // text-bearing documents; the zero value otherwise.
  LayoutComplexity layout = 3;

  // True when broken font encodings were detected in the text layer
  // (garbled text, replacement characters). Extraction output should not
  // be trusted; route to OCR. Meaningful in ANALYZE and FULL only.
  bool has_encoding_issues = 4;

  // Wall-clock milliseconds for the whole call, classification included.
  uint64 processing_time_ms = 5;

  // Per-page OCR reasons from the pass that read the text layer, as
  // distinct from `PdfInfo.ocr_reasons`, which comes from the sampling
  // detection. Populated in ANALYZE and FULL.
  //
  // `has_encoding_issues` above is these reasons collapsed to one boolean;
  // it stays for callers that only want the routing bit.
  repeated PageOcrReasons extraction_ocr_reasons = 6;
}

// ServerLimits reports the ceilings a server actually enforces.
message ServerLimits {
  // Largest accepted upload in bytes, measured as it is received.
  // Exceeding it fails the call with RESOURCE_EXHAUSTED before the
  // document is parsed.
  uint64 max_document_bytes = 1;

  // Largest single `chunk` frame the server will accept on the request
  // stream. A larger upload is legal; split it across more frames.
  uint64 max_chunk_bytes = 2;

  // How many ParsePdf calls may run concurrently. Further calls wait
  // rather than being refused, because the bound exists to cap CPU and
  // heap, not to shed load.
  uint32 max_concurrent_parses = 3;
}
